---
deployment:
  tasks:
    - export DEPLOY_PATH="$HOME/career-portal/naukri-com"

    - /bin/cp -R app "$DEPLOY_PATH"
    - /bin/cp -R bootstrap "$DEPLOY_PATH"
    - /bin/cp -R config "$DEPLOY_PATH"
    - /bin/cp -R database "$DEPLOY_PATH"
    - /bin/cp -R lang "$DEPLOY_PATH"
    - /bin/cp -R resources "$DEPLOY_PATH"
    - /bin/cp -R routes "$DEPLOY_PATH"
    - /bin/cp -R storage "$DEPLOY_PATH"
    - /bin/cp -R tests "$DEPLOY_PATH"
    - /bin/cp -R public "$DEPLOY_PATH"

    - /bin/cp -R public/css public/js public/images public/vendor "$HOME/public_html/"
    - /bin/cp public/favicon.ico "$HOME/public_html/"
    # robots.txt is now served by Laravel (it points at the live sitemap); an old static copy would shadow it.
    - /bin/rm -f "$HOME/public_html/robots.txt"

    - /bin/cp artisan "$DEPLOY_PATH"
    - /bin/cp composer.json "$DEPLOY_PATH"
    - /bin/cp composer.lock "$DEPLOY_PATH"
    - /bin/cp package.json "$DEPLOY_PATH"
    - /bin/cp vite.config.js "$DEPLOY_PATH"

    - /bin/cp -R docs "$DEPLOY_PATH"
    - /bin/cp -R scripts "$DEPLOY_PATH"

    # All artisan steps run from one script that logs to storage/logs/deploy.log and never stops halfway.
    # Which commit is live: shown at /health.
    - /bin/mkdir -p "$DEPLOY_PATH/storage/app" && (git log -1 --format='%h %cd %s' --date=format:'%Y-%m-%d %H:%M' > "$DEPLOY_PATH/storage/app/deployed-version.txt" || true)

    - /bin/bash "$DEPLOY_PATH/scripts/cpanel-deploy.sh" "$DEPLOY_PATH"

    # If the website runs from another folder than DEPLOY_PATH, update that folder too (see scripts/sync-live.sh).
    - /bin/bash scripts/sync-live.sh "$DEPLOY_PATH"
