services:
  - type: web
    name: engineerlaunch
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: VERIFICATION_OTP_DRIVER
        value: mail
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: live.smtp.mailtrap.io
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        value: api
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Ascendia
      - key: APP_NAME
        value: EngineerLaunch
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_HTTP_ONLY
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: JOB_INGESTION_KEY
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: engineerlaunch-db
          property: connectionString
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: database

  - type: worker
    name: engineerlaunch-email-worker
    runtime: docker
    dockerCommand: php artisan queue:work database --queue=emails,default --sleep=3 --tries=3 --timeout=120
    envVars:
      - key: APP_NAME
        value: EngineerLaunch
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: engineerlaunch-db
          property: connectionString
      - key: QUEUE_CONNECTION
        value: database
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: live.smtp.mailtrap.io
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        value: api
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Ascendia
      - key: LOG_CHANNEL
        value: stderr

  - type: cron
    name: engineerlaunch-industry-news
    runtime: docker
    schedule: "0 * * * *"
    dockerCommand: php artisan news:fetch-industry --industry=all --limit=10
    envVars:
      - key: APP_NAME
        value: EngineerLaunch
      - key: APP_ENV
        value: production
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: engineerlaunch-db
          property: connectionString
      - key: LOG_CHANNEL
        value: stderr

  - type: cron
    name: engineerlaunch-daily-events
    runtime: docker
    schedule: "30 3 * * *"
    dockerCommand: php artisan portal:send-daily-events --limit=100
    envVars:
      - key: APP_NAME
        value: EngineerLaunch
      - key: APP_ENV
        value: production
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: engineerlaunch-db
          property: connectionString
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stderr

databases:
  - name: engineerlaunch-db
    plan: free
    databaseName: engineerlaunch
    user: engineerlaunch
